{% extends "base.html" %}
{% block title %}登录 - DeeperSeeker{% endblock %}
{% block content %}
<h1>管理后台登录</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
    <div class="form-row">
        <input type="text" name="username" placeholder="用户名" required style="width:300px;">
    </div>
    <div class="form-row">
        <input type="password" name="password" placeholder="密码" required style="width:300px;">
    </div>
    <button type="submit">登录</button>
</form>
{% endblock %}
